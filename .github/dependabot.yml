version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Let new releases settle before proposing them.
    cooldown:
      default-days: 7
    groups:
      go-dependencies:
        patterns: ["*"]

  # Actions are pinned to commit SHAs; Dependabot updates the SHA and its
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
